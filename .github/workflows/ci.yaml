name: CI

on:
  push:
    paths:
      - '.github/workflows/ci.yaml'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node versions supported by nestjs 11.x/12.x (@nestjs/core engines: >= 20)
        node-version: ['20', '22', '24']
        nest-version: ['5', '6', '7', '8', '9', '10', '11']
        include:
          # nestjs 12.x (package.json) is ESM-only: jest can require() it natively only on node 24.9+
          - { node-version: '24', nest-version: '' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm config set legacy-peer-deps true
          npm install

      - name: Install nestjs
        if: matrix.nest-version
        run: npm install @nestjs/common@^${{ matrix.nest-version }} @nestjs/core@^${{ matrix.nest-version }} @nestjs/testing@^${{ matrix.nest-version }}

      - name: Install platform-express
        if: >-
          startsWith(matrix.nest-version, '6') ||
          startsWith(matrix.nest-version, '7') ||
          startsWith(matrix.nest-version, '8') ||
          startsWith(matrix.nest-version, '9') ||
          startsWith(matrix.nest-version, '10') ||
          startsWith(matrix.nest-version, '11')
        run: npm install @nestjs/platform-express@^${{ matrix.nest-version }}

      # nestjs 5.x-7.x supports rxjs 6.x
      - name: Install rxjs
        if: >-
          startsWith(matrix.nest-version, '5') ||
          startsWith(matrix.nest-version, '6') ||
          startsWith(matrix.nest-version, '7')
        run: npm install rxjs@^6

      - name: Lint
        if: startsWith(matrix.node-version, '24')
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
